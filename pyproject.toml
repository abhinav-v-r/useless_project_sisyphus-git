[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sisyphus_git"]

[project]
name = "sisyphus-git"
version = "0.1.0"
description = "A malevolent Git pre-commit hook that interrogates developers about the existential meaninglessness of their code."
authors = [
    {name = "AI"}
]
dependencies = [
    "rich",
    "groq",
    "nltk",
    "python-dotenv",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "requests"
]
requires-python = ">=3.9"

[project.scripts]
sisyphus-install = "sisyphus_git.installer:main"
sisyphus-run = "sisyphus_git.main:main"
sisyphus-leaderboard = "sisyphus_git.leaderboard:main"
